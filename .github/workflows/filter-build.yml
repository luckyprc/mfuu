name: "Build raw sub (scv=true)"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - env:
          UPSTREAM_SUB: "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray"
        run: |
          mkdir -p output
          python scripts/filter.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/*
          if ! git diff --cached --quiet; then
            git commit -m "Update raw subs (scv=true)"
            git push origin main
          fi
